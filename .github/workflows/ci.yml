name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests examples tools
      - name: Schemas are up to date
        run: house-ai schemas check
      - name: Leak scan (no private data in public code/docs)
        run: python tools/leak_scan.py
      - name: Exclude private projects before running tests
        run: |
          git sparse-checkout init --no-cone
          git sparse-checkout set '/*' '!/projects/'
      - name: Tests (synthetic data only; no private survey, no network)
        run: python -m pytest -q
