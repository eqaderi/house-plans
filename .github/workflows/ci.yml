name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plans:
    name: Tests, checks and sheets
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HP_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned libraries
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Check every design spec
        run: |
          shopt -s nullglob
          status=0
          for spec in design/*.yaml design/examples/*.yaml; do
            echo "::group::$spec"
            bin/hp check "$spec" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Draw the sheets (sketch stage, or the full build for final-stage specs)
        run: |
          shopt -s nullglob
          status=0
          for spec in design/*.yaml design/examples/*.yaml; do
            if grep -Eq '^[[:space:]]*stage:[[:space:]]*final' "$spec"; then
              bin/hp build "$spec" || status=1
            else
              bin/hp sketch "$spec" || status=1
            fi
          done
          bin/hp build design/examples/bungalow.yaml --out out/_pipeline-selftest || status=1
          exit $status

      - name: Keep the sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: |
            out/**/*.png
            out/**/*.pdf
            out/**/report.md
          if-no-files-found: ignore
