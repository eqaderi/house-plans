schema_version: 0.1.0
project_id: my-house
assumptions:
- id: asm-typical-sizes
  statement: 'Rooms without a size from you use typical sizes for a first layout:
    Entrance hall 6 m², Living room 32.5 m², Kitchen and everyday dining 23 m², Dining
    14 m², Pantry 4 m², Main bedroom 15 m², Bedroom for older relatives 11 m², Child''s
    bedroom 1 11 m², Child''s bedroom 2 11 m², En-suite bathroom 5 m², Accessible
    bathroom 7 m², Bathroom 2 6 m², Study 1 9 m², Garage 36 m², Laundry 6 m², Store
    room 5 m², Plant / technical room 4 m², Stair 10 m², Lift 4 m², Terrace 16 m²,
    Balcony 6 m². These are not building-code minimums; no local rules are loaded.'
  basis: house-ai typical-size table (program.builder.TYPICAL)
  status: assumption
  affects:
  - pi-entry
  - pi-living
  - pi-kitchen
  - pi-dining
  - pi-pantry
  - pi-bed-main
  - pi-bed-elder-1
  - pi-bed-child-1
  - pi-bed-child-2
  - pi-bath-ensuite
  - pi-bath-1
  - pi-bath-2
  - pi-study-1
  - pi-garage
  - pi-laundry
  - pi-storage
  - pi-mechanical
  - pi-stair
  - pi-lift
  - pi-terrace
  - pi-balcony
  confirm_with: owner
  made_by: null
- id: asm-circulation
  statement: Halls, walls and structure add 20% to the room areas.
  basis: Typical share for a compact house; checked again in Milestone D.
  status: assumption
  affects:
  - program
  confirm_with: architect
  made_by: null
- id: asm-entry-and-plant
  statement: The house has an entrance hall and a small plant / technical room.
  basis: Every house needs a way in and room for heating, water and electrics.
  status: assumption
  affects:
  - pi-entry
  - pi-mechanical
  confirm_with: owner
  made_by: null
- id: asm-site-unverified
  statement: Site values used here (parcel area, slope, frontage) come from the survey
    but you have not confirmed the site yet.
  basis: Site gate not approved for this site version.
  status: unknown
  affects:
  - program
  confirm_with: owner
  made_by: null
- id: asm-hillside-engineering
  statement: Steep hillside terrain requires split-level or stepped massing, road-level
    access coordination, excavation, retaining walls, slope drainage, and structural
    engineering review; the full parcel area cannot be assumed buildable.
  basis: Surveyed site relief and slope indicate steep hillside construction.
  status: assumption
  affects:
  - program
  confirm_with: engineer
  made_by: null
- id: asm-car-size
  statement: Each car is taken as 1.8 m wide and 4.5 m long, with 0.6 m to open its
    doors, to test the garage.
  basis: typical car envelope (assumption until the owner gives the car size)
  status: assumption
  affects:
  - pi-garage
  confirm_with: owner
  made_by: null
- id: asm-beds
  statement: The main bedroom is tested for a double bed and children's bedrooms for
    single beds.
  basis: Who sleeps where, from the household answers.
  status: assumption
  affects:
  - pi-bed-main
  - pi-bed-child-1
  - pi-bed-child-2
  confirm_with: owner
  made_by: null
