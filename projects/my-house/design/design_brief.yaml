- id: ans-q-priorities-22
  topic: priorities
  key: answer
  statement: After that, I have a question now for you. Looking at this, at this field,
    I think everything is clear now for you. Considering the geometry, the topology,
    the axis to outside the field, the sun, sunshine during the year, probably wind,
    the climate, whatever the fuck, which I don't know right now. Where do you think
    the building of the house should be placed? We have a lot of places. Which where
    inside this whole area should that be, and why? What's the reason? And I really,
    really like to have a garden, a place for my kids to be able to play. Something,
    for example, when I look down the city, I would like to see big trees in front
    of me. When the wind comes, I love the sound of the trees. When it rains, it's
    really beautiful. And if we can make it level, not steps, or at least a few steps
    for the garden. I'm saying steps because, you know, it's on a slope. That would
    be absolutely perfect. But I don't know really, where do you think, considering
    all of this, like an expert, what do you suggest the house should be? How much
    should be the footprint? Should we build them on top of each other? Two floors
    or one floor? Where should the garage be? Consider the slope. The slope, I think,
    is a little bit too steep. So yeah, whatever answer you give me, if you can, please
    do it in Persian. But what you're recording the project, it would be nice if it
    would have been in English. So you can also talk to me in English, but I just
    prefer Persian. So yeah.
  value: null
