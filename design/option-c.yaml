# Option C: option B reworked after the owner's reaction (docs/brief.md, "Reaction
# to option B"). Same three levels; the house stands 3.0 m off the north
# boundary (north windows allowed), the stair and lift sit on the north side with
# daylight, the lower floor steps out east and south under the upper floor's
# terraces, the kitchen is a galley with open ends to the lobby and to the dining,
# no hashti, a wudhu place beside the prayer room, no walk-in closet, no big store.
#   G   ±0.00  garage at the road, stair/lift lobby
#   UF  -3.20  entry, kitchen, dining, living, prayer + wudhu, WC
#   LF  -6.40  bedrooms, baths, laundry, plant; stands out east and south
# One U stair (19 risers of 168.4 mm, going 300, flights 10 + 9, 1200 wide) with the
# lift at its west end on every level; the half landing is at the east wall, so
# going down you face the east window.
