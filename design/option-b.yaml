# Option B: three levels stepping down the slope, the house pushed to the
# north-west of the plot so the south and east stay open (owner, docs/brief.md).
#   G   ±0.00  garage at the road, lift lobby, boiler room
#   UF  -3.20  living floor, entered at grade from the south-west garden
#   LF  -6.40  bedroom floor, set furthest east where the ground is lowest
# One U stair (19 risers of 168.4 mm, going 300, flights 10 + 9, 1200 wide,
# docs/research-stairs.md) is stacked over all three levels with the lift
# beside it. Its half landings lie on the south wall: going down, you face a
# south window.
# Frame: origin plot corner V3, x along the south boundary (docs/decisions.md).
