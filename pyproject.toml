[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-ai"
version = "0.1.0"
description = "HOUSE DESIGN AI: a canonical semantic house model with explicit human approval gates"
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: the committed JSON Schemas in schemas/ are generated by pydantic,
# and the drift test compares against them, so a different pydantic release
# could change the output. Bump deliberately and re-run `house-ai schemas export`.
dependencies = [
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "shapely==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[project.scripts]
house-ai = "house_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
