[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-ai"
version = "0.1.0"
description = "HOUSE DESIGN AI: a canonical semantic house model with explicit human approval gates"
readme = "README.md"
requires-python = ">=3.13"
# Compatible bounds for installation; exact schema-generation versions are
# pinned in requirements-lock.txt. After bumping pydantic, re-run
# `house-ai schemas export`.
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "shapely>=2.1,<3",
  # S8: geometry adapter validated in S3; no vendor types in domain.
  "trimesh>=5.1,<6",
  "manifold3d>=3.5,<4",
  # Milestone B: DXF reading, and CRS/datum lookups and transforms (bundles PROJ).
  "ezdxf>=1.4,<2",
  "pyproj>=3.7,<4",
  # Milestone D: CP-SAT constraint solver for floor-plan layout (ADR 0013).
  "ortools>=9.12,<10",
  # Vectorised geometry predicates in the usability evaluators (shapely's own array type).
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Runs the suite on four worker processes by default (ADR 0035).
  "pytest-xdist>=3.6",
  "ruff>=0.9",
]
# Milestone C: the Claude adapter for the AI-assisted interview (ADR 0010). Optional;
# everything else, including the tests, runs without it.
ai = [
  "anthropic>=1.15,<2",
]

[project.scripts]
house-ai = "house_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Four workers measured fastest on an 11-core laptop (more workers contend for the CPU);
# each test file stays on one worker so module fixtures are built once (ADR 0035).
# Run single-process with `-n 0`.
addopts = "-ra -n 4 --dist loadfile"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

# Functions over the limit when it was introduced carry `# noqa: C901`; remove the
# suppression when one is split up. New code stays within the limit.
[tool.ruff.lint.mccabe]
max-complexity = 15
